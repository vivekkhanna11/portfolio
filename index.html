<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivek Khanna, Urban Planning Portfolio</title>
<meta name="description" content="Urban planning, transportation, and community design work by Vivek Khanna, presented as an interactive application window.">
<link rel="stylesheet" href="assets/css/style.css">

<style>
  /* Full-screen application window shell */
  html, body { height:100%; overflow:hidden; }
  body { background:var(--graphite-3); }

  .site-header { display:none; } /* the app window replaces the marketing chrome on this page */

  .app-window {
    position:fixed; inset:14px;
    display:flex; flex-direction:column;
    background:var(--graphite);
    border:1px solid var(--line-dark);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,0.55);
  }

  /* ---- Title bar ---- */
  .app-titlebar {
    flex:none; height:42px; display:flex; align-items:center; gap:14px;
    padding:0 14px;
    background:var(--graphite-2);
    border-bottom:1px solid var(--graphite-3);
  }
  .app-dots { display:flex; gap:7px; }
  .app-dots i { width:11px; height:11px; border-radius:50%; display:block; }
  .app-dots i:nth-child(1) { background:#e0605a; }
  .app-dots i:nth-child(2) { background:#e0b94f; }
  .app-dots i:nth-child(3) { background:#7c9473; }
  
  /* Integrated Brand Logo */
  .app-titlebar .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .app-titlebar .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: var(--dark-green, #1E5631);
    color: #ffffff;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    border-radius: 2px;
  }
  .app-titlebar .brand-name {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--offwhite);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .app-titlebar .brand-name small {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: var(--steel-light);
    font-weight: 400;
  }

  .app-title-coord { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--steel); }

  /* ---- Menu bar ---- */
  .app-menubar {
    flex:none; height:32px; display:flex; align-items:stretch;
    background:var(--graphite-2); border-bottom:1px solid var(--graphite-3);
    position:relative; z-index:50;
  }
  .app-menu { position:relative; }
  .app-menu > button {
    height:100%; padding:0 14px; background:transparent; border:none;
    font-family:var(--mono); font-size:11px; letter-spacing:0.04em;
    color:var(--steel-light); cursor:pointer;
  }
  .app-menu > button:hover, .app-menu.is-open > button { background:var(--graphite-3); color:var(--offwhite); }
  .app-menu-drop {
    position:absolute; top:100%; left:0; min-width:220px;
    background:var(--graphite-2); border:1px solid var(--graphite-3);
    box-shadow:0 16px 34px rgba(0,0,0,0.4);
    display:none; flex-direction:column; padding:6px 0;
  }
  .app-menu.is-open .app-menu-drop { display:flex; }
  .app-menu-drop button {
    text-align:left; background:transparent; border:none; cursor:pointer;
    padding:9px 16px; font-family:var(--mono); font-size:11.5px; color:var(--steel-light);
  }
  .app-menu-drop button:hover { background:var(--graphite-3); color:var(--offwhite); }
  .app-menu-drop button:disabled { opacity:0.35; cursor:default; }
  .app-menu-drop button:disabled:hover { background:transparent; color:var(--steel-light); }
  .app-menu-sep { height:1px; background:var(--graphite-3); margin:6px 0; }

  /* ---- Toolbar ---- */
  .app-toolbar {
    flex:none; min-height:44px; display:flex; align-items:center; gap:8px;
    padding:6px 12px; flex-wrap:wrap;
    background:var(--graphite); border-bottom:1px solid var(--graphite-3);
  }
  .app-tool {
    display:flex; align-items:center; gap:7px;
    height:30px; padding:0 11px;
    background:var(--graphite-2); border:1px solid var(--graphite-3);
    color:var(--steel-light); font-family:var(--mono); font-size:10.5px; letter-spacing:0.03em;
    cursor:pointer; white-space:nowrap;
  }
  .app-tool:hover { border-color:var(--sage); color:var(--offwhite); }
  .app-tool svg { width:13px; height:13px; flex:none; }
  .app-tool-sep { width:1px; align-self:stretch; background:var(--graphite-3); margin:2px 4px; }
  .app-status-zoom { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--steel); }
  .app-window.is-compact .app-menubar,
  .app-window.is-compact .app-toolbar { display:none; }

  /* ---- Tab bar ---- */
  .app-tabbar {
    flex:none; height:36px; display:flex; align-items:stretch;
    background:var(--graphite-2); border-bottom:1px solid var(--graphite-3);
    overflow-x:auto;
  }
  .app-tab {
    display:flex; align-items:center; gap:9px;
    padding:0 14px; border-right:1px solid var(--graphite-3);
    font-family:var(--mono); font-size:11px; color:var(--steel);
    cursor:pointer; white-space:nowrap; flex:none;
  }
  .app-tab .dot { width:6px; height:6px; border-radius:50%; background:var(--sage); flex:none; }
  .app-tab.is-active { background:var(--graphite); color:var(--offwhite); box-shadow:inset 0 -2px 0 var(--sage); }
  .app-tab .x {
    margin-left:2px; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    border-radius:3px; color:var(--steel);
  }
  .app-tab .x:hover { background:var(--graphite-3); color:var(--offwhite); }

  /* ---- Content area ---- */
  .app-content { position:relative; flex:1 1 auto; overflow:hidden; background:var(--graphite); }
  .app-pane { position:absolute; inset:0; display:none; }
  .app-pane.is-active { display:block; }
  .app-pane iframe { width:100%; height:100%; border:0; display:block; background:var(--offwhite); }

  /* ---- Status bar ---- */
  .app-statusbar {
    flex:none; height:24px; display:flex; align-items:center; gap:18px;
    padding:0 14px; background:var(--graphite-2); border-top:1px solid var(--graphite-3);
    font-family:var(--mono); font-size:10px; color:var(--steel);
  }
  .app-statusbar .r { margin-left:auto; }

  /* ---- Canvas (inside Portfolio.gh) ---- */
  .flow-viewport {
    position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none;
  }
  .flow-viewport.is-panning { cursor:grabbing; }
  .flow-canvas {
    position:absolute; top:0; left:0; width:2020px; height:1060px;
    transform-origin:0 0; will-change:transform;
    background-image:radial-gradient(circle, rgba(242,240,234,0.16) 1.2px, transparent 1.2px);
    background-size:28px 28px;
  }
  .flow-canvas.no-grid { background-image:none; }
  .flow-wires { position:absolute; top:0; left:0; width:2020px; height:1060px; overflow:visible; pointer-events:none; }
  .flow-wire { fill:none; stroke:var(--sage); stroke-width:1.6; opacity:0.45; transition:opacity .15s ease, stroke-width .15s ease; }
  .flow-wire.is-lit { opacity:0.95; stroke-width:2.2; stroke:var(--sage-pale); }

  .flow-node {
    position:absolute; width:210px; height:96px;
    background:var(--graphite-2); border:1px solid var(--line-dark); border-radius:5px;
    cursor:pointer; user-select:none; box-shadow:0 10px 26px rgba(0,0,0,0.35);
    transition:border-color .15s ease, box-shadow .15s ease; touch-action:none;
  }
  .flow-node:hover { border-color:var(--sage); box-shadow:0 10px 30px rgba(124,148,115,0.22); }
  .flow-node.is-dragging { cursor:grabbing; z-index:30; border-color:var(--sage-pale); }
  .flow-node.is-selected { border-color:var(--sage-pale); box-shadow:0 0 0 3px rgba(205,215,196,0.18); }

  .flow-node-head { display:flex; align-items:center; gap:7px; padding:8px 11px; border-bottom:1px solid var(--line-dark); }
  .flow-node-dot { width:6px; height:6px; border-radius:50%; background:var(--sage); flex:none; }
  .flow-node-tag { font-family:var(--mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--sage-pale); }
  .flow-node-body { padding:10px 12px 12px; }
  .flow-node-name { font-family:var(--display); font-weight:600; font-size:14px; color:var(--offwhite); line-height:1.25; }
  .flow-node-sub { margin-top:5px; font-family:var(--mono); font-size:9.5px; color:var(--steel-light); line-height:1.4; }

  .flow-port { position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--graphite-2); border:1.5px solid var(--sage-pale); transform:translateY(-50%); }
  .flow-port.out { right:-6px; background:var(--sage); }
  .flow-port.in { left:-6px; }

  /* ---- Profile Node ---- */
  .flow-node.is-profile { width:230px; height:206px; }
  .flow-node-photo {
    width:100%; height:104px; overflow:hidden;
    border-bottom:1px solid var(--line-dark);
    background:var(--graphite-3);
    position:relative;
  }
  .flow-node-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .flow-node-photo .ph-fallback {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--steel);
  }
  .flow-node-photo .ph-fallback svg { width:30px; height:30px; opacity:0.6; }
  .flow-node-photo .ph-fallback span { font-family:var(--mono); font-size:8.5px; letter-spacing:0.1em; text-transform:uppercase; }

  /* ---- Enhanced Detail panel ---- */
  .flow-panel {
    position:absolute; top:0; right:0; bottom:0; width:min(440px, 100%);
    background:var(--paper); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .32s cubic-bezier(0.16,1,0.3,1);
    z-index:40; overflow-y:auto;
  }
  .flow-panel.is-open { transform:translateX(0); }
  .flow-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px 16px; border-bottom:1px solid var(--line); }
  .flow-panel-close { width:30px; height:30px; flex:none; border:1px solid var(--line); background:transparent; color:var(--steel); cursor:pointer; font-family:var(--mono); font-size:14px; }
  .flow-panel-close:hover { border-color:var(--graphite); color:var(--ink); }
  .flow-panel-body { padding:20px 22px 32px; }
  .flow-panel-tag { font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--sage-deep); }
  .flow-panel-title { font-family:var(--display); font-weight:600; font-size:1.4rem; margin-top:6px; line-height:1.15; }
  .flow-panel-loc { font-family:var(--mono); font-size:11.5px; color:var(--steel); margin-top:8px; display:block; }
  .flow-panel-scope { margin-top:16px; font-size:14px; line-height:1.6; color:#2c3134; }
  
  .flow-panel-section-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--dark-green, #1E5631);
    margin-top: 20px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--line);
  }

  .flow-panel .plate-meta { margin-top:14px; }
  .flow-panel .plate-deliverables { margin-top:16px; }
  .flow-panel-course { display:block; margin-top:18px; font-family:var(--mono); font-size:11px; color:var(--steel); }
  .flow-panel-actions { margin-top:24px; display:flex; flex-wrap:wrap; gap:10px; }
  .flow-panel-actions button.btn, .flow-panel-actions a.btn { font-family:var(--mono); text-decoration:none; display:inline-block; }

  .flow-scrim { position:absolute; inset:0; background:rgba(23,25,27,0.35); opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:35; }
  .flow-scrim.is-open { opacity:1; pointer-events:auto; }

  .flow-legend {
    position:absolute; left:14px; bottom:14px; z-index:5;
    display:flex; flex-wrap:wrap; gap:14px;
    font-family:var(--mono); font-size:10px; color:var(--steel-light);
    background:rgba(23,25,27,0.55); padding:8px 12px; border:1px solid var(--graphite-3);
  }
  .flow-legend span { display:inline-flex; align-items:center; gap:6px; }
  .flow-legend i { width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--sage); }
  .flow-legend i.hollow { background:transparent; border:1.5px solid var(--sage-pale); }

  /* ---- Mobile View ---- */
  .flow-fallback { display:none; }
  @media (max-width:760px) {
    .app-window { inset:0; border-radius:0; }
    .app-menubar, .app-toolbar, .app-statusbar, .flow-legend { display:none; }
    .flow-viewport { display:none; }
    .flow-fallback {
      display:grid; gap:1px; background:var(--graphite-3);
      position:absolute; inset:0; overflow:auto; padding:1px;
    }
    .flow-fallback a { display:block; background:var(--graphite-2); padding:16px 18px; font-family:var(--mono); font-size:11.5px; color:var(--steel-light); }
    .flow-fallback a b { display:block; font-family:var(--display); font-size:15px; font-weight:600; color:var(--offwhite); margin-top:3px; }
  }
</style>
</head>
<body>

<div class="custom-cursor" id="customCursor" aria-hidden="true"></div>

<div class="app-window" id="appWindow">

  <div class="app-titlebar">
    <div class="app-dots"><i></i><i></i><i></i></div>
    
    <!-- Added Logo Component -->
    <a href="index.html" class="brand">
      <span class="brand-mark">VK</span>
      <span class="brand-name">VIVEK KHANNA<small>Urban &amp; Transportation Planning</small></span>

    <span class="app-title-coord">43.6532&deg; N&nbsp;&nbsp;79.3832&deg; W, Toronto, ON</span>

  <!-- Menu Bar -->
  <div class="app-menubar" id="appMenubar">

<script>
(function(){
  /* Node hover/interaction state (drag highlighting, wire lighting, etc.)
     lives further down. Cursor behavior now comes entirely from the
     shared assets/js/main.js, so every page behaves identically. */

  const NODE_W = 210, NODE_H = 96;

  /* ---- Expanded Data Model for Node Panels ---- */
  const NODES = [
    { id:'source', x:40, y:400, w:230, h:206, photo:true, tag:'SOURCE', title:'Vivek Khanna', sub:'Toronto, ON',
      panel:{ type:'about',
        body:"I'm an urban design and transportation planning professional with a background in BIM coordination and construction project management. Most of what's below traces back to the same habit: understand what's actually on the ground before proposing anything.",
        overview: "Specializing in integrated spatial workflows, parametric data modeling, multimodal safety frameworks, and evidence-based master planning.",
        credentials: ['B.Arch', 'Postgrad Urban & Transportation Planning (Seneca)', 'Postgrad Construction PM (Fanshawe)'],
        software: ['Revit', 'Dynamo', 'AutoCAD', 'GIS', 'Rhino', 'Enscape'],
        openTab:'about', linkLabel:'Open full profile' } },

    { id:'p1', x:340, y:420, tag:'01', title:'Read Site', sub:'Aerials, census, field photos',
      panel:{ type:'process',
        body:"Before I sketch anything, I want the base layer right: boundaries, land use, demographics, housing type, and as much historical aerial imagery as I can find. You can't fix a plan you haven't actually looked at.",
        methodology: "Multilayered spatial diagnostic process aggregating historical satellite overlays, municipal GIS layers, and census dissemination block profiles.",
        outputs: ['Dissemination Area Demographics', 'Time-series Built-form Maps', 'Contextual Site Matrix'],
        tools:['Aerial time-series','Demographic profiling','Site photography', 'ArcGIS Pro'] } },

    { id:'p2', x:620, y:420, tag:'02', title:'Diagnose Conflicts', sub:'Lynch mapping, SWOT',
      panel:{ type:'process',
        body:"I'd rather measure a problem than describe it. That might mean mapping a site through Kevin Lynch's paths, edges, nodes, districts and landmarks, running a SWOT, or pulling hard numbers like crossing distance and posted speed.",
        methodology: "Evaluating physical legibility alongside micro-mobility friction points and vehicle collision frequency records.",
        outputs: ['5-Element Imageability Maps', 'Crossing Exposure Index', 'Conflict Heatmaps'],
        tools:['Lynch: paths, edges, nodes','SWOT','Safety exposure metrics', 'Speed & Volume Audits'] } },

    { id:'p3', x:900, y:420, tag:'03', title:'Align to Policy', sub:'Vision Zero, Official Plan',
      panel:{ type:'process',
        body:"Most municipalities already have an Official Plan, a Vision Zero target, or a cycling network plan on the books. I like holding the site up against those documents directly, it turns a design opinion into something closer to an accountability check.",
        methodology: "Translating broad policy goals (e.g., Toronto Complete Streets, Vision Zero) into measurable spatial metrics for design scoring.",
        outputs: ['Policy Scorecard Matrices', 'Stakeholder Requirement Logs', 'Precedent Benchmarks'],
        tools:['Policy alignment scorecards','Community survey synthesis','Precedent review', 'Toronto Complete Streets Guidelines'] } },

    { id:'p4', x:1180, y:420, tag:'04', title:'Design + Phase', sub:'Short, medium, long term',
      panel:{ type:'process',
        body:"I try to avoid all-or-nothing masterplans. Proposals get broken into tiers: what could go in this year with paint and signal timing, what needs a construction season, and what's a longer horizon rebuild.",
        methodology: "Phased capital expenditure programming integrated directly into 3D massing and ROW cross-section iterations.",
        outputs: ['Phased Implementation Timelines', 'Tactical Urbanism Quick-Builds', 'Parametric Cost Estimates'],
        tools:['Phased roadmaps','Before / after massing','Constraint mapping', 'Revit/Dynamo Auto-QTO'] } },

  /* ---- Node Rendering ---- */
  function renderNodes(){

  function portPos(node, which){
    const w = node.w || NODE_W, h = node.h || NODE_H;
    return which === 'out' ? { x: node.x + w, y: node.y + h / 2 } : { x: node.x, y: node.y + h / 2 };
  }
  function wirePath(fromNode, toNode){
    const a = portPos(fromNode, 'out'), b = portPos(toNode, 'in');
    const midX = (a.x + b.x) / 2;
    return `M ${a.x},${a.y} C ${midX},${a.y} ${midX},${b.y} ${b.x},${b.y}`;
  }
  function renderWires(){
    svg.innerHTML = '';
    CONNECTIONS.forEach(([fromId, toId]) => {
      const fromNode = NODES.find(n => n.id === fromId);
      const toNode   = NODES.find(n => n.id === toId);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class', 'flow-wire');
      path.setAttribute('d', wirePath(fromNode, toNode));
      path.dataset.from = fromId; path.dataset.to = toId;
      svg.appendChild(path);
    });
  }
  function updateWiresFor(nodeId){
    svg.querySelectorAll('.flow-wire').forEach(path => {
      if (path.dataset.from === nodeId || path.dataset.to === nodeId) {
        const fromNode = NODES.find(n => n.id === path.dataset.from);
        const toNode   = NODES.find(n => n.id === path.dataset.to);
        path.setAttribute('d', wirePath(fromNode, toNode));
      }
    });
  }
  function litWiresFor(nodeId, on){
    svg.querySelectorAll('.flow-wire').forEach(path => {
      if (path.dataset.from === nodeId || path.dataset.to === nodeId) path.classList.toggle('is-lit', on);
    });
  }
  function setNodePos(node, x, y){
    node.x = x; node.y = y;
    const el = canvas.querySelector('[data-id="'+node.id+'"]');
    if (el) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
    updateWiresFor(node.id);
  }

  function openPanel(node){

  /* ---- Node Drag & Click ---- */
  function wireNodeDrag(el, nodeData){
    let dragging = false, moved = false;
    let startClientX = 0, startClientY = 0, startX = 0, startY = 0;

    el.addEventListener('mouseenter', () => { if (selectedId !== nodeData.id) litWiresFor(nodeData.id, true); });
    el.addEventListener('mouseleave', () => { if (selectedId !== nodeData.id) litWiresFor(nodeData.id, false); });

    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      dragging = true; moved = false;
      startClientX = e.clientX; startClientY = e.clientY;
      startX = nodeData.x; startY = nodeData.y;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = (e.clientX - startClientX) / state.zoom;
      const dy = (e.clientY - startClientY) / state.zoom;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (!moved) return;
      el.classList.add('is-dragging');
      setNodePos(nodeData, startX + dx, startY + dy);
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('is-dragging');
      if (!moved) openPanel(nodeData);
    };
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  /* ---- Canvas Pan ---- */
  let panning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target !== viewport && e.target !== canvas) return;
    panning = true;
    viewport.classList.add('is-panning');
    panStartX = e.clientX; panStartY = e.clientY;
    panOriginX = state.pan.x; panOriginY = state.pan.y;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!panning) return;
    state.pan.x = panOriginX + (e.clientX - panStartX);
    state.pan.y = panOriginY + (e.clientY - panStartY);
    applyTransform();
  });
  const endPan = () => { panning = false; viewport.classList.remove('is-panning'); };
  viewport.addEventListener('pointerup', (e) => {
    endPan();
    if (e.target === viewport || e.target === canvas) closePanel();
  });
  viewport.addEventListener('pointercancel', endPan);

  /* ---- Zoom Controls ---- */
  function setZoom(z){ state.zoom = Math.min(1.4, Math.max(0.5, z)); applyTransform(); }
  viewport.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(state.zoom - e.deltaY * 0.001); }, { passive:false });

  function resetView(){ state.pan = { x:-10, y:-180 }; state.zoom = 1; applyTransform(); }
  function focusNode(id){
    const n = NODES.find(x => x.id === id); if (!n) return;
    const rect = viewport.getBoundingClientRect();
    const w = n.w || NODE_W, h = n.h || NODE_H;
    state.zoom = 1;
    state.pan.x = rect.width / 2 - (n.x + w / 2);
    state.pan.y = rect.height / 2 - (n.y + h / 2);
    applyTransform();
    openPanel(n);
  }
  function resetPositions(){
    NODES.forEach(n => setNodePos(n, n.origX, n.origY));

      else if (p.openTab === 'house') { href = 'house-viewer.html'; }
      else if (p.openTab === 'construction') { href = 'construction.html'; }
      else { href = 'approach.html'; }
      return '<a href="'+href+'"'+targetAttrs+'>' + n.tag + '<b>' + n.title + '</b></a>';
    }).join('');
  }

    activeTab = id;

  function openTab(id){
    if (id === 'portfolio') { activateTab('portfolio'); return; }
    if (!TAB_DEFS[id]) return;
    let tabBtn = tabbar.querySelector('[data-tab="'+id+'"]');
    if (!tabBtn) {
      tabBtn = document.createElement('div');
      tabBtn.className = 'app-tab';
      tabBtn.dataset.tab = id;
      tabBtn.innerHTML = '<span class="dot"></span>' + TAB_DEFS[id].label + '<span class="x" data-close="'+id+'">&times;</span>';
      tabBtn.addEventListener('click', (e) => {
        if (e.target.closest('[data-close]')) return;
        activateTab(id);
      });
      tabBtn.querySelector('[data-close]').addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(id);
      });
      tabbar.appendChild(tabBtn);

      const pane = document.createElement('div');
      pane.className = 'app-pane';
      pane.dataset.pane = id;
      pane.innerHTML = '<iframe src="' + TAB_DEFS[id].src + '" title="' + TAB_DEFS[id].label + '"></iframe>';
      content.appendChild(pane);
    }
    activateTab(id);
    closeAllMenus();
  }

    const tabBtn = tabbar.querySelector('[data-tab="'+id+'"]');

  }
  menubar.querySelectorAll('.app-menu > button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.parentElement;
      const wasOpen = menu.classList.contains('is-open');
      closeAllMenus();
      if (!wasOpen) menu.classList.add('is-open');
    });
  });
  document.addEventListener('click', closeAllMenus);

  function runAction(el){
    const action = el.getAttribute('data-action');
    switch(action){
      case 'open-tab': openTab(el.getAttribute('data-tab')); break;
      case 'print': window.print(); break;
      case 'reset-positions': resetPositions(); break;
      case 'deselect': closePanel(); break;
      case 'zoom-in': setZoom(state.zoom + 0.15); break;
      case 'zoom-out': setZoom(state.zoom - 0.15); break;
      case 'zoom-reset': resetView(); break;
      case 'toggle-grid': canvas.classList.toggle('no-grid'); break;
      case 'fullscreen':
        if (document.fullscreenElement) document.exitFullscreen();
        else appWindow.requestFullscreen && appWindow.requestFullscreen();
        break;
      case 'compact': appWindow.classList.toggle('is-compact'); break;
      case 'focus': focusNode(el.getAttribute('data-node')); break;
      case 'mailto': window.location.href = 'mailto:vivekkhanna.canada@gmail.com'; break;
      case 'new-tab-menu':
        closeAllMenus();
        menubar.querySelector('.app-menu').classList.add('is-open');
        return;
    }
    closeAllMenus();
  }
  menubar.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (btn) runAction(btn);
  });
  document.querySelector('.app-toolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.stopPropagation();
    runAction(btn);
  });

  renderNodes();
  renderWires();
  applyTransform();
  renderFallback();
})();
</script>
</body>
</html>
